<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOPN NFT Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; margin: 5px; border: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-connect { background: #f59e0b; }
        .btn-mint { background: #10b981; }
        .btn-fetch { background: #3b82f6; }
        #status { margin-top: 20px; color: #333; word-wrap: break-word; font-size: 14px;}
        
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border-radius: 12px; width: 300px; }
        .wallet-btn { width: 100%; padding: 15px; margin: 5px 0; background: #fff; color: #000; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .wallet-btn:hover { border-color: #3b82f6; background: #f9fafb; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }

        .nft-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 250px; display: inline-block; margin-top: 20px; background: #fafafa; }
        .nft-card img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h1>IOPN NFT Collection</h1>
    <p>Mint ton NFT sur le Testnet IOPN !</p>
    
    <button id="connectBtn" class="btn-connect">🦊 / 🔶 Connecter Wallet</button>
    <button id="mintBtn" class="btn-mint" style="display:none;">Mint NFT</button>
    
    <p id="status"></p>

    <hr style="margin: 30px 0;">

    <h2>Marketplace / Collection</h2>
    <button id="fetchBtn" class="btn-fetch" style="display:none;">Voir le NFT #0</button>
    <div id="nftDisplay"></div>
</div>

<div id="walletModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModal">&times;</span>
    <h3>Choisis ton Wallet</h3>
    <button class="wallet-btn" id="okxConnect">🔶 OKX Wallet</button>
    <button class="wallet-btn" id="metaConnect">🦊 MetaMask</button>
  </div>
</div>

<script>
    // TON ADRESSE EXACTE TROUVEE SUR L'EXPLORATEUR
    const CONTRACT_ADDRESS = "0x947D37af32CD984Db50AB376dDb0702615D0b28f";
    const METADATA_CID = "bafkreiguappsizxhwwalgotc4jw6b56sj4ho3g7imsgkvgicf266e545nu";

    const ABI = [
        "function mint(address to, string memory uri) public",
        "function tokenURI(uint256 tokenId) view returns (string)"
    ];

    let provider, signer, contract;
    let selectedProvider;

    const modal = document.getElementById("walletModal");
    const connectBtn = document.getElementById("connectBtn");

    connectBtn.onclick = () => { modal.style.display = "block"; };
    document.getElementById("closeModal").onclick = () => { modal.style.display = "none"; };
    window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; };

    document.getElementById("okxConnect").onclick = async () => {
        if (typeof window.okxwallet !== "undefined") {
            selectedProvider = window.okxwallet;
            modal.style.display = "none";
            await connectWallet();
        } else { alert("OKX Wallet n'est pas installé !"); }
    };

    document.getElementById("metaConnect").onclick = async () => {
        if (typeof window.ethereum !== "undefined") {
            selectedProvider = window.ethereum;
            modal.style.display = "none";
            await connectWallet();
        } else { alert("MetaMask n'est pas installé !"); }
    };

    async function connectWallet() {
        try {
            provider = new ethers.BrowserProvider(selectedProvider);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
            
            const address = await signer.getAddress();
            document.getElementById("status").innerText = "Connecté : " + address.substring(0,6) + "...";
            document.getElementById("connectBtn").style.display = "none";
            document.getElementById("mintBtn").style.display = "inline-block";
            document.getElementById("fetchBtn").style.display = "inline-block";
        } catch (err) {
            console.error(err);
            document.getElementById("status").innerText = "Erreur de connexion.";
        }
    }

    document.getElementById("mintBtn").onclick = async () => {
        try {
            document.getElementById("status").innerText = "Transaction en cours...";
            const address = await signer.getAddress();
            const tx = await contract.mint(address, "ipfs://" + METADATA_CID);
            await tx.wait();
            document.getElementById("status").innerText = "Succès ! NFT Minté ! 🎉";
        } catch (err) {
            console.error(err);
            document.getElementById("status").innerText = "Erreur Mint.";
        }
    };

    document.getElementById("fetchBtn").onclick = async () => {
        try {
            document.getElementById("status").innerText = "Étape 1 : Lecture du contrat...";
            
            // 1. Lecture du contrat
            const uri = await contract.tokenURI(0);
            document.getElementById("status").innerText = "Étape 2 : Lien trouvé (" + uri.substring(0,30) + "...)";
            
            // 2. Conversion du lien IPFS
            const httpUrl = uri.replace("ipfs://", "https://ipfs.io/ipfs/");
            document.getElementById("status").innerText = "Étape 3 : Téléchargement métadonnées...";
            
            // 3. Récupération JSON
            const response = await fetch(httpUrl);
            if(!response.ok) throw new Error("IPFS bloque le téléchargement");
            const metadata = await response.json();
            
            document.getElementById("status").innerText = "Étape 4 : Affichage de l'image...";
            const imageUrl = metadata.image.replace("ipfs://", "https://ipfs.io/ipfs/");

            // 4. Affichage
            document.getElementById("nftDisplay").innerHTML = `
                <div class="nft-card">
                    <img src="${imageUrl}" alt="NFT Image">
                    <h3>${metadata.name}</h3>
                    <p>${metadata.description}</p>
                </div>
            `;
            document.getElementById("status").innerText = "Succès ! NFT chargé ! 🎉";
        } catch (err) {
            console.error("Erreur complete:", err);
            let errorMsg = "Erreur inconnue";
            if (err.reason) errorMsg = err.reason;
            else if (err.message) errorMsg = err.message;
            
            document.getElementById("status").innerText = "ERREUR BLOQUANTE : " + errorMsg.substring(0, 300);
        }
    };
</script>

</body>
</html>
